<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="tf-logo-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="48" height="48" rx="11" fill="url(#tf-logo-bg)"/>
  <!-- Inner ring for definition against both light and dark backgrounds -->
  <rect x="0.5" y="0.5" width="47" height="47" rx="10.5" stroke="white" stroke-opacity="0.12"/>
  <!-- Top-left highlight for depth -->
  <ellipse cx="10" cy="7" rx="20" ry="14" fill="white" opacity="0.07"/>

  <!-- Bold checkmark -->
  <path d="M9 25 L19 35 L39 13"
        stroke="white" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>

</svg>
