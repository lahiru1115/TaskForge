services:
  - type: web
    name: taskforge-backend
    runtime: node
    plan: free
    rootDir: taskforge-backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # healthCheckPath: /api/health — set once the health endpoint lands (see docs/SCALING.md, Phase 0)
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
